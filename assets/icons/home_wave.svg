<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="180"
     viewBox="0 0 760 180"
     fill="none">

    <defs>
        <linearGradient id="waveFill1" x1="0" y1="45" x2="0" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563EB" stop-opacity="0.16"/>
            <stop offset="0.55" stop-color="#2563EB" stop-opacity="0.07"/>
            <stop offset="1" stop-color="#2563EB" stop-opacity="0.01"/>
        </linearGradient>
        <linearGradient id="waveFill2" x1="0" y1="80" x2="0" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#3B82F6" stop-opacity="0.09"/>
            <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- 확정 시안처럼 면이 느껴지는 넓은 물결 -->
    <path
        d="M-40 105
           C105 32 245 38 380 90
           C520 145 635 135 800 52
           L800 180
           L-40 180
           Z"
        fill="url(#waveFill1)"/>

    <path
        d="M-30 128
           C125 58 260 62 390 108
           C520 154 648 150 795 88
           L795 180
           L-30 180
           Z"
        fill="url(#waveFill2)"/>

    <!-- 은은한 곡선 라인 -->
    <path
        d="M-40 105
           C105 32 245 38 380 90
           C520 145 635 135 800 52"
        stroke="#2563EB"
        stroke-width="2"
        stroke-opacity="0.18"/>

    <path
        d="M-30 118
           C120 50 255 54 388 102
           C520 150 642 144 795 74"
        stroke="#3B82F6"
        stroke-width="1.6"
        stroke-opacity="0.15"/>

    <path
        d="M-20 132
           C135 68 270 72 398 114
           C530 158 650 154 790 96"
        stroke="#60A5FA"
        stroke-width="1.2"
        stroke-opacity="0.11"/>
</svg>
